[project]
name = "tts-harness"
version = "0.1.0"
description = "Standalone Python CLI for evaluating TTS providers on timed segments."
requires-python = ">=3.11"
dependencies = [
    "google-genai",
    "httpx",
    "python-dotenv",
    "typer",
    "pydantic",
]

[project.scripts]
tts-harness = "src.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
